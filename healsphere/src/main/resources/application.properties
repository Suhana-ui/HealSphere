spring.application.name=healsphere
server.port=8080

# --- Database (H2 stored in ./data so history survives restarts) ---
spring.datasource.url=jdbc:h2:file:./data/healsphere
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- H2 console: LOCAL DEVELOPMENT ONLY (http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# --- Never leak internal error details to the browser ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
spring.thymeleaf.cache=false
